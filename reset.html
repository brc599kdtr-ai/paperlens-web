<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>更新 PaperLens</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #17221e;
        background: #f4f1ea;
        font-family: system-ui, "PingFang SC", sans-serif;
      }
      main {
        width: min(440px, calc(100vw - 40px));
        padding: 28px;
        border: 1px solid #ddd8ce;
        border-radius: 18px;
        background: #fff;
        text-align: center;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
      }
      p {
        color: #51605a;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 12px;
        padding: 11px 18px;
        border-radius: 10px;
        color: #fff;
        background: #28664f;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">正在清理旧缓存…</h1>
      <p id="message">完成后会自动打开新版 PaperLens。</p>
      <a id="manualLink" href="./viewer.html?demo=1&v=8" hidden>打开新版</a>
    </main>
    <script>
      (async function () {
        try {
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(
              keys
                .filter((key) => key.startsWith("paperlens-"))
                .map((key) => caches.delete(key))
            );
          }
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(
              registrations
                .filter((registration) =>
                  registration.scope.includes("/paperlens-web/")
                )
                .map((registration) => registration.unregister())
            );
          }
          document.querySelector("#title").textContent = "缓存已清理";
          document.querySelector("#message").textContent =
            "正在打开新版；如果两秒后没有自动跳转，请点下面的按钮。";
          setTimeout(() => location.replace("./viewer.html?demo=1&v=8"), 800);
        } catch (error) {
          document.querySelector("#title").textContent = "自动清理失败";
          document.querySelector("#message").textContent = error.message;
          document.querySelector("#manualLink").hidden = false;
        }
      })();
    </script>
  </body>
</html>
